[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutroom"
version = "0.1.0"
description = "Short-form (9:16) video editor: a rendering pipeline plus an editing brain that runs on Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "yt-dlp[default,curl-cffi]",
    "librosa>=0.10",
    "pillow>=10",
    "pillow-heif>=0.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["anthropic>=1.0"]           # only for the optional anthropic-api brain backend
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cutroom = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "server*"]

[tool.setuptools.package-data]
engine = ["overlay/*", "brain/prompts/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["node_modules", "workspace", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E741",   # `l` as a name in the pipeline's short loops
    "B008",   # FastAPI's Depends()/Query() in defaults is the idiom
    "B905",   # zip() without strict= in the pipeline's pairwise loops
    "UP006", "UP007", "UP035",   # keep the pipeline's typing style on 3.10
]

[tool.ruff.lint.per-file-ignores]
# the pipeline modules carried over from scripts/ keep their compact style
"engine/{autocut,beats,brief,contact_sheet,edl,facetrack,make_sfx,media,moments,plan,reference,render,transcribe,voice}.py" = ["E501", "E731", "B007", "UP031"]
"tests/test_brain.py" = ["E501"]   # canned CLI output lines

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real video (seconds to minutes)"]
filterwarnings = ["ignore::DeprecationWarning"]
